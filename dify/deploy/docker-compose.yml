# 《宇宙离谱法庭》依赖栈：seekdb + PowerContext + 庭审后端
#
# 用法（在 dify/ 目录下）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Dify 本体不在本文件中，请使用官方 docker compose 单独部署；
# 导入 DSL 前把两个 HTTP 节点的地址改成 Dify 容器能访问到的地址。

name: absurd-court

services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: absurd-court-seekdb
    ports:
      - "2881:2881"
    volumes:
      - seekdb-data:/var/lib/oceanbase
    restart: unless-stopped

  powercontext:
    build:
      context: ..
      dockerfile: deploy/powercontext.Dockerfile
    container_name: absurd-court-powercontext
    ports:
      - "8000:8000"
    volumes:
      - powercontext-data:/data
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
    restart: unless-stopped

  court-api:
    build:
      context: ..
      dockerfile: deploy/court.Dockerfile
    container_name: absurd-court-api
    ports:
      - "8088:8088"
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ""
      SEEKDB_DATABASE: absurd_court
      POWERCONTEXT_BASE_URL: http://powercontext:8000
      POWERCONTEXT_ENABLED: "1"
      EMBEDDING_BACKEND: hash
      EMBEDDING_DIM: "128"
      COURT_AUTO_INIT: "1"
      COURT_INIT_RETRIES: "60"
      COURT_INIT_DELAY: "2"
    depends_on:
      - seekdb
      - powercontext
    restart: unless-stopped

volumes:
  seekdb-data:
  powercontext-data:

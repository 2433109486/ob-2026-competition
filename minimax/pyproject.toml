[project]
name = "booknest-sdd-demo"
version = "0.1.0"
description = "BookNest sample service and SDD context module for the MiniMax competition entry"
requires-python = ">=3.11"
dependencies = [
  "pymysql>=1.1.1",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false

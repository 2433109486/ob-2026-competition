[project]
name = "yanmai-researchpulse"
version = "1.0.0"
description = "A traceable literature-review workspace powered by seekdb and PowerContext."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pymysql>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

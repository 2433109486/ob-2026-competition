  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/today" data-route="today" aria-label="研脉首页">
        <span class="brand-mark">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M8 10.5C8 8.6 9.6 7 11.5 7H32v23.5c0 .8-.7 1.5-1.5 1.5H12a4 4 0 0 0-4 4V10.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/>

            <circle cx="27" cy="27" r="4.5" fill="var(--coral)" stroke="none"/>
            <path d="M25 27h4M27 25v4" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>研脉</strong>
          <small>RESEARCH PULSE</small>
        </span>
      </a>

      <div class="sidebar-section">
        <span class="sidebar-label">工作台</span>
        <nav class="nav" aria-label="主导航">
          <a href="#/today" data-route="today" class="nav-item"><span class="nav-icon"><svg><use href="#i-sun"></use></svg></span><span>今日</span><span class="nav-dot"></span></a>
          <a href="#/search" data-route="search" class="nav-item"><span class="nav-icon"><svg><use href="#i-search"></use></svg></span><span>证据检索</span><kbd>⌘K</kbd></a>
          <a href="#/library" data-route="library" class="nav-item"><span class="nav-icon"><svg><use href="#i-library"></use></svg></span><span>资料库</span><span class="nav-count" id="nav-paper-count">—</span></a>
          <a href="#/review" data-route="review" class="nav-item"><span class="nav-icon"><svg><use href="#i-table"></use></svg></span><span>综述矩阵</span></a>
          <a href="#/memory" data-route="memory" class="nav-item"><span class="nav-icon"><svg><use href="#i-brain"></use></svg></span><span>研究记忆</span><span class="nav-count" id="nav-memory-count">—</span></a>
        </nav>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-note">
        <span class="status-orb" id="pc-orb"></span>
        <div>
          <strong id="pc-status-text">正在连接研究记忆</strong>
          <small>PowerContext · 本地</small>
        </div>
      </div>

      <button class="profile-chip" type="button" data-action="open-profile" aria-label="编辑研究画像">
        <span class="avatar" id="sidebar-avatar">林</span>
        <span class="profile-chip-copy">
          <strong id="sidebar-name">研究者</strong>
          <small id="sidebar-stage">文献综述</small>
        </span>
        <svg class="profile-chip-icon"><use href="#i-more"></use></svg>
      </button>
    </aside>

    <div class="mobile-scrim" id="mobile-scrim" data-action="close-sidebar"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" type="button" data-action="open-sidebar" aria-label="打开菜单"><svg><use href="#i-menu"></use></svg></button>
        <div class="crumbs">
          <span class="crumb-root">研脉</span>
          <span class="crumb-slash">/</span>
          <span id="crumb-current">今日</span>
        </div>
        <div class="topbar-right">
          <button class="command-hint" type="button" data-action="focus-search">
            <svg><use href="#i-search"></use></svg>
            <span>检索证据、作者、方法</span>
            <kbd>⌘ K</kbd>
          </button>
          <span class="health-chip" id="health-chip"><span class="status-orb"></span><span>本地</span></span>
          <button class="avatar avatar-small" type="button" data-action="open-profile" id="top-avatar">林</button>
        </div>
      </header>

      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
